name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11"]
      fail-fast: false

    env:
      # The app, the asset validator and several tests print Chinese text.
      # On a Windows runner stdout is a pipe, so Python falls back to the ANSI
      # code page (cp1252) and raises UnicodeEncodeError without this.
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate character assets
        run: python tools/validate_assets.py

      - name: Verify --version flag
        run: python main.py --version

      # Block scalar: the inline form broke YAML parsing because the plain
      # scalar contained a "colon + space" sequence inside the f-string.
      - name: Verify imports resolve correctly
        run: |
          python -c "from app.version import __version__; print(f'Version: {__version__}')"
