name: CI

on:
  push:
    branches: [main, "feat/**", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Validate runtime assets
        run: python tools/validate_assets.py
      - name: Verify version flag
        run: python main.py --version
      - name: Verify core imports
        run: |
          python -c "from app.version import VERSION; from app.recovery import CrashRecovery; from app.updater import UpdateClient; print(f'Version: {VERSION}')"
